name: Validate BiraConsultant source and assets
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/validate-bira.yml
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Check PHP syntax and Composer metadata
        run: |
          find app bootstrap config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          composer validate --no-check-publish
      - name: Build frontend assets
        run: |
          npm ci --no-audit --no-fund
          npm run production
      - name: Check old branding is gone
        run: |
          rm -f .github/workflows/validate-bira.yml
          if find . -path './.git' -prune -o -iname '*qjobs*' -print | grep -q .; then
            echo "Legacy QJobs file or directory name found"
            exit 1
          fi
          if git grep -niE 'QJobs|qjobs' -- . ':!*.zip'; then
            echo "Legacy QJobs text found"
            exit 1
          fi
      - name: Commit generated assets and remove validation workflow
        run: |
          rm -f .github/workflows/validate-bira.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Build and verify BiraConsultant frontend assets"
            git push
          fi
