name: Extract main Laravel source
on:
  push:
    branches: [main]
    paths:
      - QJobs.zip
      - .github/workflows/extract-laravel-source.yml
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract Laravel project files
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path, PurePosixPath

          archive = Path("QJobs.zip")
          allowed_dirs = {
              "app", "bootstrap", "config", "database", "public",
              "resources", "routes", "storage", "tests"
          }
          allowed_files = {
              ".editorconfig", ".env.example", ".gitattributes", ".gitignore",
              "README.md", "artisan", "composer.json", "composer.lock",
              "package.json", "package-lock.json", "phpunit.xml",
              "tailwind.config.js", "webpack.mix.js"
          }

          if not archive.is_file():
              raise SystemExit("QJobs.zip is missing from the repository")

          written = 0
          with zipfile.ZipFile(archive) as zf:
              for item in zf.infolist():
                  name = item.filename
                  if item.is_dir() or not name.startswith("QJobs/"):
                      continue
                  relative = PurePosixPath(name).relative_to("QJobs")
                  if not relative.parts or ".." in relative.parts:
                      continue
                  top = relative.parts[0]
                  if top not in allowed_dirs and str(relative) not in allowed_files:
                      continue
                  target = Path(*relative.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(zf.read(item))
                  written += 1

          if written == 0:
              raise SystemExit("No Laravel source files were extracted")
          print(f"Extracted {written} Laravel project files")
          PY
      - name: Commit extracted source
        run: |
          rm -f .github/workflows/extract-laravel-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .editorconfig .env.example .gitattributes .gitignore README.md artisan composer.json composer.lock package.json package-lock.json phpunit.xml tailwind.config.js webpack.mix.js app bootstrap config database public resources routes storage tests
          git commit -m "Extract main Laravel source from QJobs archive"
          git push
