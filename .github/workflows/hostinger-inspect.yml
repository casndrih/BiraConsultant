name: Hostinger current installation inspection

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/hostinger-inspect.yml"

permissions:
  contents: read

jobs:
  inspect-existing-installation:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current site without changing files or exposing secrets
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          port: ${{ secrets.HOSTINGER_PORT }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          command_timeout: 2m
          script: |
            set -eu
            APP_DIR="$HOME/domains/biraconsultants.com/public_html"
            echo "=== EXISTING SITE DIRECTORY ==="
            ls -la "$APP_DIR" | head -60
            echo "=== LARAVEL VERSION ==="
            if [ -f "$APP_DIR/artisan" ]; then
              cd "$APP_DIR"
              php artisan --version 2>&1 || true
            else
              echo "No artisan file in current document root"
            fi
            echo "=== CURRENT GIT METADATA ==="
            if [ -d "$APP_DIR/.git" ]; then
              git -C "$APP_DIR" remote get-url origin 2>/dev/null || true
              git -C "$APP_DIR" branch --show-current 2>/dev/null || true
              git -C "$APP_DIR" rev-parse --short HEAD 2>/dev/null || true
              git -C "$APP_DIR" status --short 2>/dev/null | head -30
            else
              echo "No Git metadata in current document root"
            fi
            echo "=== SAFE ENVIRONMENT SUMMARY ==="
            if [ -f "$APP_DIR/.env" ]; then
              grep -E '^(APP_NAME|APP_ENV|APP_DEBUG|APP_URL|DB_CONNECTION|DB_PORT)=' "$APP_DIR/.env" | sed -E 's/(APP_KEY|DB_PASSWORD|MAIL_PASSWORD|AWS_SECRET_ACCESS_KEY)=.*/\1=[redacted]/' || true
              grep -E '^(DB_HOST|DB_DATABASE|DB_USERNAME)=' "$APP_DIR/.env" | sed -E 's/=.*/=[configured]/' || true
            else
              echo "No .env file found"
            fi
            echo "=== ROOT HTACCESS ==="
            if [ -f "$APP_DIR/.htaccess" ]; then
              sed -n '1,180p' "$APP_DIR/.htaccess"
            fi
            echo "=== PUBLIC ENTRYPOINT ==="
            if [ -f "$APP_DIR/public/index.php" ]; then
              sed -n '1,100p' "$APP_DIR/public/index.php"
            fi
            echo "=== HOSTINGER MARKER ==="
            if [ -f "$HOME/domains/biraconsultants.com/DO_NOT_UPLOAD_HERE" ]; then
              cat "$HOME/domains/biraconsultants.com/DO_NOT_UPLOAD_HERE"
            fi
            echo "=== INSPECTION COMPLETE; NO CHANGES MADE ==="
