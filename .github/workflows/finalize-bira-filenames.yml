name: Finalize BiraConsultant filenames
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-bira-filenames.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename remaining legacy paths
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          def brand_name(value):
              def repl(match):
                  token = match.group(0)
                  if token.isupper():
                      return "BIRACONSULTANT"
                  if token.islower():
                      return "biraconsultant"
                  return "BiraConsultant"
              return re.sub(r"qjobs", repl, value, flags=re.IGNORECASE)

          # The archive is redundant now that its Laravel source is extracted.
          Path("QJobs.zip").unlink(missing_ok=True)

          # Rename matching files and directories from the deepest level upward.
          for current, dirs, files in os.walk(".", topdown=False):
              current_path = Path(current)
              for name in files:
                  if re.search(r"qjobs", name, re.IGNORECASE):
                      source = current_path / name
                      target = current_path / brand_name(name)
                      if source.exists() and source != target:
                          source.rename(target)
              for name in dirs:
                  if re.search(r"qjobs", name, re.IGNORECASE):
                      source = current_path / name
                      target = current_path / brand_name(name)
                      if source.exists() and source != target:
                          source.rename(target)

          # Verify no legacy brand remains in tracked text or file paths.
          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          text_ext = {".php", ".css", ".js", ".json", ".md", ".txt", ".xml", ".html", ".htm", ".yml", ".yaml", ".sh", ".sql", ".svg", ".lock", ".conf", ".ini"}
          remaining = []
          for raw in paths:
              if not raw:
                  continue
              if re.search(r"qjobs", raw, re.IGNORECASE):
                  remaining.append("PATH: " + raw)
                  continue
              path = Path(raw)
              if not path.is_file() or (path.suffix.lower() not in text_ext and path.name not in {".env.example", ".htaccess", "artisan"}):
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if re.search(r"qjobs", content, re.IGNORECASE):
                  remaining.append("TEXT: " + raw)
          if remaining:
              print("\n".join(remaining))
              raise SystemExit("Legacy QJobs references remain; review before finalizing.")
          print("No QJobs/qjobs references remain in tracked text or paths.")
          PY
      - name: Commit final filename cleanup
        run: |
          rm -f .github/workflows/finalize-bira-filenames.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish BiraConsultant project rename"
          git push
