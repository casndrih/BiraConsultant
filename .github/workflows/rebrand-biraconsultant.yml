name: Rebrand QJobs as BiraConsultant
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/rebrand-biraconsultant.yml
permissions:
  contents: write
jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply BiraConsultant branding
        shell: bash
        run: |
          python3 - <<'PY'
          import colorsys
          import json
          import re
          import subprocess
          from pathlib import Path

          root = Path(".")
          files = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          text_extensions = {
              ".php", ".css", ".js", ".json", ".md", ".txt", ".xml",
              ".html", ".htm", ".yml", ".yaml", ".sh", ".sql", ".svg",
              ".lock", ".example", ".conf", ".ini", ".map"
          }
          changed = 0

          def replace_brand(text):
              def brand(match):
                  value = match.group(0)
                  if value.isupper():
                      return "BIRACONSULTANT"
                  if value.islower():
                      return "biraconsultant"
                  return "BiraConsultant"
              text = re.sub(r"QJobs", brand, text, flags=re.IGNORECASE)
              text = re.sub(r"qj(?=[_-])", "bc", text, flags=re.IGNORECASE)
              text = re.sub(r"qjobs\.com", "biraconsultants.com", text, flags=re.IGNORECASE)
              return text

          def warm_color(match):
              value = match.group(0)
              if value.startswith("#"):
                  raw = value[1:]
                  if len(raw) == 3:
                      raw = "".join(ch * 2 for ch in raw)
                  if len(raw) != 6:
                      return value
                  rgb = tuple(int(raw[i:i+2], 16) / 255 for i in (0, 2, 4))
                  h, s, l = colorsys.rgb_to_hls(*rgb)
                  if 70 <= h * 360 <= 165 and s > 0.12:
                      h = 45 / 360
                      s = min(max(s, 0.42), 0.78)
                      r, g, b = colorsys.hls_to_rgb(h, l, s)
                      return "#{:02x}{:02x}{:02x}".format(round(r*255), round(g*255), round(b*255))
                  return value
              nums = re.findall(r"[-+]?(?:\d*\.)?\d+", value)
              if len(nums) < 3:
                  return value
              rgb = tuple(max(0, min(255, float(n))) / 255 for n in nums[:3])
              h, s, l = colorsys.rgb_to_hls(*rgb)
              if not (70 <= h * 360 <= 165 and s > 0.12):
                  return value
              h = 45 / 360
              s = min(max(s, 0.42), 0.78)
              r, g, b = colorsys.hls_to_rgb(h, l, s)
              parts = [str(round(r*255)), str(round(g*255)), str(round(b*255))]
              return ("rgba(" if value.startswith("rgba") else "rgb(") + ", ".join(parts + nums[3:]) + ")"

          for raw in files:
              if not raw:
                  continue
              path = Path(raw)
              if not path.is_file() or path.name == "QJobs.zip":
                  continue
              if path.suffix.lower() not in text_extensions and path.name not in {".env.example", ".htaccess", "artisan"}:
                  continue
              try:
                  original = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = replace_brand(original)
              if path.name in {"qjobs-theme.css", "biraconsultant-theme.css"}:
                  updated = re.sub(r"#[0-9a-fA-F]{3,6}\b|rgba?\([^)]*\)", warm_color, updated)
                  updated = re.sub(r"--bc-brand\s*:\s*[^;]+;", "--bc-brand: #F4C542;", updated)
                  updated = re.sub(r"--bc-brand-hover\s*:\s*[^;]+;", "--bc-brand-hover: #E5B82E;", updated)
                  updated = re.sub(r"--bc-brand-soft\s*:\s*[^;]+;", "--bc-brand-soft: #FFF7D6;", updated)
                  updated = re.sub(r"--bc-brand-ink\s*:\s*[^;]+;", "--bc-brand-ink: #5B4500;", updated)
                  if "--bc-brand:" not in updated:
                      updated = updated.replace(":root {", ":root {\n    --bc-brand: #F4C542;\n    --bc-brand-hover: #E5B82E;\n    --bc-brand-soft: #FFF7D6;\n    --bc-brand-ink: #5B4500;", 1)
                  updated += """

          /* BiraConsultant gold brand overrides */
          :root {
            --bc-brand: #F4C542;
            --bc-brand-hover: #E5B82E;
            --bc-brand-soft: #FFF7D6;
            --bc-brand-ink: #5B4500;
          }
          .bc-brand__logo { display: block; width: 44px; height: 44px; flex: 0 0 auto; object-fit: contain; }
          .text-green-50,.text-green-100,.text-green-200,.text-green-300,.text-green-400,.text-green-500,.text-green-600,.text-green-700,.text-green-800,.text-green-900 { color: var(--bc-brand-ink) !important; }
          .bg-green-50,.bg-green-100,.bg-green-200 { background-color: var(--bc-brand-soft) !important; }
          .bg-green-300,.bg-green-400,.bg-green-500,.bg-green-600,.bg-green-700,.bg-green-800,.bg-green-900 { background-color: var(--bc-brand) !important; color: #4A3900 !important; }
          .border-green-100,.border-green-200,.border-green-300,.border-green-400,.border-green-500,.border-green-600,.border-green-700 { border-color: var(--bc-brand-hover) !important; }
          .hover\\:bg-green-50:hover,.hover\\:bg-green-100:hover,.hover\\:bg-green-200:hover,.hover\\:bg-green-500:hover,.hover\\:bg-green-600:hover,.hover\\:bg-green-700:hover { background-color: var(--bc-brand-hover) !important; }
          .focus\\:ring-green-500:focus,.focus\\:border-green-500:focus { --tw-ring-color: var(--bc-brand) !important; border-color: var(--bc-brand) !important; }
          """
              if path.name == "app.php" and path.parent.name == "config":
                  updated = updated.replace("env('APP_NAME', 'Laravel')", "env('APP_NAME', 'BiraConsultant')")
              if path.name == "package.json":
                  try:
                      data = json.loads(updated)
                      data["name"] = "biraconsultant"
                      updated = json.dumps(data, indent=4) + "\n"
                  except Exception:
                      pass
              if path.name == "composer.json":
                  try:
                      data = json.loads(updated)
                      data["name"] = "biraconsultant/biraconsultant"
                      data["description"] = "BiraConsultant recruitment and job marketplace application."
                      data["keywords"] = ["biraconsultant", "recruitment", "jobs", "marketplace", "laravel"]
                      updated = json.dumps(data, indent=4) + "\n"
                  except Exception:
                      pass
              if path.name == "manifest.json" and "favicon" in path.parts:
                  try:
                      data = json.loads(updated)
                      data["name"] = "BiraConsultant"
                      data["short_name"] = "BiraConsultant"
                      data["theme_color"] = "#F4C542"
                      data["background_color"] = "#FFF7D6"
                      updated = json.dumps(data, indent=2) + "\n"
                  except Exception:
                      pass
              if path.name == ".env.example":
                  if re.search(r"^APP_NAME=.*$", updated, flags=re.MULTILINE):
                      updated = re.sub(r"^APP_NAME=.*$", 'APP_NAME="BiraConsultant"', updated, flags=re.MULTILINE)
                  else:
                      updated = 'APP_NAME="BiraConsultant"\n' + updated
              if path.name == "README.md":
                  updated = """# BiraConsultant

          BiraConsultant is a Laravel 11 recruitment and job marketplace application.

          ## Requirements
          - PHP 8.2+
          - Composer
          - Node.js and npm
          - MySQL or another Laravel-supported database

          ## Setup
          1. Copy `.env.example` to `.env` and configure the database, mail, application URL, and integrations.
          2. Run `composer install`.
          3. Generate an application key with `php artisan key:generate`.
          4. Run migrations with `php artisan migrate`.
          5. Install frontend dependencies with `npm install`.
          6. Build frontend assets with `npm run production`.
          7. Start the application with `php artisan serve`.

          ## Branding
          The BiraConsultant interface uses a yellow/gold accent palette. The theme source is
          `resources/css/biraconsultant-theme.css` and its published copy is in
          `public/css/biraconsultant-theme.css`. The Bira Consultants logo and favicon assets
          are stored under `resources/images/favicon` and `public/images/favicon`.

          ## License
          See [LICENSE](LICENSE).
          """
              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed += 1

          # Point the public and source layouts at the existing Bira Consultants logo asset.
          header = Path("resources/views/layouts/header.blade.php")
          if header.exists():
              content = header.read_text(encoding="utf-8")
              content = re.sub(
                  r'<span class="bc-brand__mark" aria-hidden="true">.*?</span>',
                  '<img class="bc-brand__logo" src="{{ URL::asset(\'images/favicon/logo.svg\') }}" alt="Bira Consultants logo">',
                  content,
                  flags=re.DOTALL
              )
              content = content.replace('aria-label="QJobs home"', 'aria-label="BiraConsultant home"')
              header.write_text(content, encoding="utf-8")

          footer = Path("resources/views/layouts/footer.blade.php")
          if footer.exists():
              content = footer.read_text(encoding="utf-8").replace('alt="Company name"', 'alt="Bira Consultants logo"')
              footer.write_text(content, encoding="utf-8")

          # Rename the theme stylesheet in both source and published asset locations.
          for old in (Path("resources/css/qjobs-theme.css"), Path("public/css/qjobs-theme.css")):
              if old.exists():
                  old.rename(old.with_name("biraconsultant-theme.css"))

          # Ensure the Mix build publishes the renamed stylesheet and logo assets.
          mix = Path("webpack.mix.js")
          if mix.exists():
              content = mix.read_text(encoding="utf-8").replace("qjobs-theme.css", "biraconsultant-theme.css")
              mix.write_text(content, encoding="utf-8")

          # Apply the BiraConsultant browser theme color to both public entry points.
          for entry in (Path("resources/views/app.blade.php"), Path("resources/views/admin/app.blade.php")):
              if entry.exists():
                  content = entry.read_text(encoding="utf-8")
                  content = re.sub(r'(<meta name="(?:msapplication-TileColor|theme-color)" content=")[^"]*(")', r'\1#F4C542\2', content)
                  entry.write_text(content, encoding="utf-8")

          print(f"Updated branding in {changed} tracked text files.")
          PY
      - name: Commit BiraConsultant rebrand
        run: |
          rm -f .github/workflows/rebrand-biraconsultant.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebrand QJobs as BiraConsultant with yellow theme"
          git push
