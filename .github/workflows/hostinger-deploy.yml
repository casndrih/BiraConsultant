name: Deploy BiraConsultant to Hostinger

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/hostinger-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy fresh Laravel release and reset demo database
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          port: ${{ secrets.HOSTINGER_PORT }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          command_timeout: 30m
          script: |
            set -eu

            DOMAIN_DIR="$HOME/domains/biraconsultants.com"
            WEBROOT="$DOMAIN_DIR/public_html"
            RELEASES="$DOMAIN_DIR/releases"
            RELEASE="$RELEASES/bira-$(date +%Y%m%d%H%M%S)"
            ENV_SOURCE="$WEBROOT/.env"

            echo "=== 1. VERIFY HOST AND SOURCE REQUIREMENTS ==="
            test -d "$WEBROOT"
            test -f "$ENV_SOURCE"
            command -v php >/dev/null
            command -v composer >/dev/null
            command -v node >/dev/null
            command -v npm >/dev/null
            php -r 'exit(version_compare(PHP_VERSION, "8.2.0", ">=") ? 0 : 1);'
            mkdir -p "$RELEASES"

            echo "=== 2. PRESERVE PRODUCTION CONNECTION SETTINGS ==="
            cp "$ENV_SOURCE" "$HOME/.biraconsultant-production.env"
            chmod 600 "$HOME/.biraconsultant-production.env"
            cp "$HOME/.biraconsultant-production.env" "$RELEASE/.env"
            if ! grep -q '^DB_CONNECTION=mysql$' "$RELEASE/.env"; then
              echo "STOP: Existing .env is not configured for MySQL. No source or database was deleted."
              exit 1
            fi
            for key in DB_HOST DB_DATABASE DB_USERNAME; do
              if ! grep -q "^$key=." "$RELEASE/.env"; then
                echo "STOP: $key is missing from the current .env. No source or database was deleted."
                exit 1
              fi
            done

            echo "=== 3. FETCH EXACT LATEST MAIN SOURCE ==="
            git clone --depth 1 --branch main https://github.com/casndrih/BiraConsultant.git "$RELEASE/source"
            cd "$RELEASE/source"
            test -f artisan
            test -f composer.lock
            test -f package-lock.json
            mv "$RELEASE/.env" "$RELEASE/source/.env"

            echo "=== 4. CONFIGURE PRODUCTION ENVIRONMENT ==="
            cd "$RELEASE/source"
            sed -i 's/^APP_NAME=.*/APP_NAME="BiraConsultant"/' .env
            sed -i 's/^APP_ENV=.*/APP_ENV=production/' .env
            sed -i 's/^APP_DEBUG=.*/APP_DEBUG=false/' .env
            sed -i 's#^APP_URL=.*#APP_URL=https://biraconsultants.com#' .env
            sed -i 's/^LOG_LEVEL=.*/LOG_LEVEL=error/' .env
            sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env
            sed -i 's/^CACHE_STORE=.*/CACHE_STORE=file/' .env
            sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env
            sed -i 's/^APP_KEY=.*/APP_KEY=/' .env
            grep -q '^APP_ENV=' .env && grep -q '^APP_DEBUG=' .env && grep -q '^APP_URL=' .env

            echo "=== 5. INSTALL LOCKED PRODUCTION DEPENDENCIES ==="
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            npm ci --no-audit --no-fund
            npm run build
            test -s public/build/manifest.json
            php artisan key:generate --force --no-interaction
            php artisan config:clear

            echo "=== 6. VERIFY DATABASE CONNECTION BEFORE RESET ==="
            php artisan tinker --execute='Illuminate\Support\Facades\DB::connection()->getPdo(); echo "Database connection OK".PHP_EOL;'
            php artisan migrate:status --no-ansi || true

            echo "=== 7. RESET THE OLD DEMO DATABASE AND APPLY FRESH MIGRATIONS ==="
            php artisan migrate:fresh --force --no-interaction
            php artisan migrate:status --no-ansi

            echo "=== 8. FINALIZE LARAVEL RELEASE ==="
            mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
            chmod -R ug+rwX storage bootstrap/cache
            php artisan storage:link || true
            php artisan config:cache
            php artisan view:cache

            echo "=== 9. REPLACE THE DEMO SOURCE WITH THE FRESH RELEASE ==="
            cat > "$RELEASE/root-index.php" <<'PHP'
            <?php
            require __DIR__.'/public/index.php';
            PHP
            cat > "$RELEASE/root-htaccess" <<'HTACCESS'
            Options -Indexes
            <IfModule mod_rewrite.c>
                RewriteEngine On
                RewriteRule ^index\.php$ - [L]
                RewriteCond %{REQUEST_FILENAME} -f [OR]
                RewriteCond %{REQUEST_FILENAME} -d
                RewriteRule ^ - [L]
                RewriteRule ^ index.php [L]
            </IfModule>
            <FilesMatch "^\.(env|git)">
                Require all denied
            </FilesMatch>
            <FilesMatch "^(artisan|composer\.(json|lock)|package(-lock)?\.json|phpunit\.xml)$">
                Require all denied
            </FilesMatch>
            HTACCESS
            find "$WEBROOT" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            cp -a "$RELEASE/source/." "$WEBROOT/"
            cp "$RELEASE/root-index.php" "$WEBROOT/index.php"
            cp "$RELEASE/root-htaccess" "$WEBROOT/.htaccess"
            chmod 640 "$WEBROOT/.env"
            chmod -R ug+rwX "$WEBROOT/storage" "$WEBROOT/bootstrap/cache"

            echo "=== 10. VERIFY DEPLOYED SITE ==="
            test -f "$WEBROOT/artisan"
            test -f "$WEBROOT/public/build/manifest.json"
            test -f "$WEBROOT/vendor/autoload.php"
            php "$WEBROOT/artisan" --version
            HTTP_CODE="$(curl -sS -L --max-time 45 -o /tmp/biraconsultant-home.html -w '%{http_code}' https://biraconsultants.com/)"
            echo "Homepage HTTP status: $HTTP_CODE"
            case "$HTTP_CODE" in
              200|301|302) ;;
              *) echo "Deployment verification failed with HTTP $HTTP_CODE"; exit 1 ;;
            esac
            if grep -Eqi 'Whoops|SQLSTATE\[|APP_DEBUG|ParseError|Fatal error' /tmp/biraconsultant-home.html; then
              echo "Deployment verification found an application error marker."
              exit 1
            fi
            echo "DEPLOYMENT COMPLETED: latest main source is live; prior demo tables were reset."
