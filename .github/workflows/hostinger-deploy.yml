name: Deploy BiraConsultant to Hostinger

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hostinger-deploy.yml"
      - "resources/css/biraconsultant-theme.css"
      - "resources/views/home/index.blade.php"
      - "resources/views/layouts/footer.blade.php"
      - "resources/views/layouts/header.blade.php"
      - "resources/views/app.blade.php"
      - "resources/views/companies/detail.blade.php"
      - "resources/views/partials/companies.blade.php"
      - "resources/views/components/company-card.blade.php"
      - "public/images/companies/highlands-engineering-services.svg"
      - "public/images/companies/bsp-logo.svg"
      - "public/images/companies/bsp-logo-dark.svg"
      - "resources/views/jobs/detail.blade.php"
      - "resources/views/layouts/app.blade.php"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-biraconsultant-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Setup Node for Laravel Mix
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Compile production assets
        run: |
          set -euo pipefail
          npm ci
          NODE_OPTIONS=--openssl-legacy-provider npm run production
          test -s public/mix-manifest.json
          test -s public/js/app.js
          test -s public/css/app.css
          test -s public/css/biraconsultant-theme.css

      - name: Package Laravel source
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/biraconsultant-release.tar.gz" \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='./vendor' \
            --exclude='./node_modules' \
            --exclude='./storage' \
            --exclude='./bootstrap/cache/*.php' \
            --exclude='./database/*.sqlite' \
            .
          test -s "$RUNNER_TEMP/biraconsultant-release.tar.gz"
          tar -tzf "$RUNNER_TEMP/biraconsultant-release.tar.gz" | grep -E '(^|/)artisan$'
          tar -tzf "$RUNNER_TEMP/biraconsultant-release.tar.gz" | grep -E '(^|/)public/index.php$'

      - name: Upload release archive
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_PASSWORD"
          PORT="${SSH_PORT:-65002}"
          REMOTE="$SSH_USER@$SSH_HOST"
          ARCHIVE="/tmp/biraconsultant-release-${GITHUB_RUN_ID}.tar.gz"
          sshpass -p "$SSH_PASSWORD" scp -P "$PORT" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 "$RUNNER_TEMP/biraconsultant-release.tar.gz" "$REMOTE:$ARCHIVE"

      - name: Configure Laravel and publish the production webroot
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          DB_HOST_A: ${{ secrets.HOSTINGER_DB_HOST }}
          DB_HOST_B: ${{ secrets.DB_HOST }}
          DB_PORT_SECRET: ${{ secrets.HOSTINGER_DB_PORT }}
          DB_NAME_A: ${{ secrets.HOSTINGER_DB_NAME }}
          DB_NAME_B: ${{ secrets.HOSTINGER_DB_DATABASE }}
          DB_NAME_C: ${{ secrets.DB_DATABASE }}
          DB_USER_A: ${{ secrets.HOSTINGER_DB_USER }}
          DB_USER_B: ${{ secrets.HOSTINGER_DB_USERNAME }}
          DB_USER_C: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD_A: ${{ secrets.HOSTINGER_DB_PASSWORD }}
          DB_PASSWORD_B: ${{ secrets.DB_PASSWORD }}
          SEED_DEMO_DATA: ${{ contains(github.event.head_commit.message, '[seed-demo-data]') }}
          BIRA_DEMO_PASSWORD: ${{ secrets.BIRA_DEMO_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          DB_HOST="${DB_HOST_A:-${DB_HOST_B:-localhost}}"
          DB_PORT="${DB_PORT_SECRET:-3306}"
          DB_NAME="${DB_NAME_A:-${DB_NAME_B:-${DB_NAME_C:-}}}"
          DB_USER="${DB_USER_A:-${DB_USER_B:-${DB_USER_C:-}}}"
          DB_PASSWORD="${DB_PASSWORD_A:-${DB_PASSWORD_B:-}}"
          test -n "$DB_NAME" && test -n "$DB_USER" && test -n "$DB_PASSWORD"
          DEMO_PASSWORD=""
          if [[ "$SEED_DEMO_DATA" == "true" ]]; then
            test -n "$BIRA_DEMO_PASSWORD" || { echo "BIRA_DEMO_PASSWORD secret is missing"; exit 31; }
            DEMO_PASSWORD="$BIRA_DEMO_PASSWORD"
            {
              echo "### Demo accounts"
              echo
              echo "A shared temporary password was applied to the 17 @biraconsultant.test demo accounts."
              echo "No credential value is printed in this summary or the deployment logs."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          ARCHIVE="/tmp/biraconsultant-release-${GITHUB_RUN_ID}.tar.gz"
          STAGE_NAME="biraconsultant-${GITHUB_RUN_ID}"
          printf -v Q_DB_HOST '%q' "$DB_HOST"
          printf -v Q_DB_PORT '%q' "$DB_PORT"
          printf -v Q_DB_NAME '%q' "$DB_NAME"
          printf -v Q_DB_USER '%q' "$DB_USER"
          printf -v Q_DB_PASSWORD '%q' "$DB_PASSWORD"
          printf -v Q_DEMO_PASSWORD '%q' "$DEMO_PASSWORD"
          printf -v Q_ARCHIVE '%q' "$ARCHIVE"
          printf -v Q_STAGE_NAME '%q' "$STAGE_NAME"
          REMOTE_ENV="DB_HOST=$Q_DB_HOST DB_PORT=$Q_DB_PORT DB_NAME=$Q_DB_NAME DB_USER=$Q_DB_USER DB_PASSWORD=$Q_DB_PASSWORD BIRA_DEMO_PASSWORD=$Q_DEMO_PASSWORD ARCHIVE=$Q_ARCHIVE STAGE_NAME=$Q_STAGE_NAME"
          PORT="${SSH_PORT:-65002}"
          REMOTE="$SSH_USER@$SSH_HOST"
          sshpass -p "$SSH_PASSWORD" ssh -T -p "$PORT" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 "$REMOTE" "$REMOTE_ENV bash -s" <<'REMOTE'
          set -euo pipefail
          DOMAIN="$HOME/domains/biraconsultants.com"
          APP="$DOMAIN/bira_app"
          WEBROOT="$DOMAIN/public_html"
          STAGE="$HOME/deployments/$STAGE_NAME"
          mkdir -p "$APP" "$WEBROOT" "$HOME/deployments" "$STAGE"
          test "$(readlink -f "$DOMAIN")" = "$DOMAIN"
          test "$(readlink -f "$WEBROOT")" = "$DOMAIN/public_html"
          tar -xzf "$ARCHIVE" -C "$STAGE"
          test -f "$STAGE/artisan"
          test -f "$STAGE/composer.json"
          test -f "$STAGE/composer.lock"
          test -f "$STAGE/public/index.php"

          # Overlay the checked-in application source; preserve .env, vendor and runtime storage.
          cp -a "$STAGE/." "$APP/"
          mkdir -p "$APP/bootstrap/cache" "$APP/storage/framework/cache/data" "$APP/storage/framework/sessions" "$APP/storage/framework/views" "$APP/storage/logs" "$APP/storage/app/public"
          cd "$APP"
          export DB_HOST DB_PORT DB_NAME DB_USER DB_PASSWORD WEBROOT

          # Persist production settings and generate APP_KEY only if it does not already exist.
          php <<'PHP'
          <?php
          $path = getcwd().'/.env';
          $content = is_file($path) ? file_get_contents($path) : '';
          $key = '';
          if (preg_match('/^APP_KEY=(.*)$/m', $content, $m)) {
              $key = trim($m[1], " \"'\t\r\n");
          }
          if ($key === '') {
              $key = 'base64:'.base64_encode(random_bytes(32));
          }
          $values = [
              'APP_NAME' => 'BiraConsultant',
              'APP_ENV' => 'production',
              'APP_KEY' => $key,
              'APP_DEBUG' => 'false',
              'APP_URL' => 'https://biraconsultants.com',
              'LOG_CHANNEL' => 'stack',
              'LOG_LEVEL' => 'warning',
              'DB_CONNECTION' => 'mysql',
              'DB_HOST' => getenv('DB_HOST') ?: 'localhost',
              'DB_PORT' => getenv('DB_PORT') ?: '3306',
              'DB_DATABASE' => getenv('DB_NAME') ?: '',
              'DB_USERNAME' => getenv('DB_USER') ?: '',
              'DB_PASSWORD' => getenv('DB_PASSWORD') ?: '',
              'SESSION_DRIVER' => 'file',
              'CACHE_STORE' => 'file',
              'QUEUE_CONNECTION' => 'sync',
              'MAIL_MAILER' => 'log',
              'FILESYSTEM_DISK' => 'public',
          ];
          $quote = static function ($value) {
              return '"'.str_replace(["\\", '"', "\n", "\r"], ["\\\\", '\\"', '\\n', '\\r'], (string) $value).'"';
          };
          foreach ($values as $name => $value) {
              $line = $name.'='.$quote($value);
              $pattern = '/^'.preg_quote($name, '/').'=.*$/m';
              if (preg_match($pattern, $content)) {
                  $content = preg_replace_callback($pattern, static fn () => $line, $content, 1);
              } else {
                  $content = rtrim($content)."\n".$line."\n";
              }
          }
          if (file_put_contents($path, $content, LOCK_EX) === false) {
              fwrite(STDERR, "Unable to write production .env\n");
              exit(32);
          }
          chmod($path, 0600);
          echo "PRODUCTION_ENV_CONFIGURED\n";
          PHP

          if command -v composer >/dev/null 2>&1; then
              composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
          elif [ ! -f "$APP/vendor/autoload.php" ]; then
              echo "Composer is unavailable and vendor/autoload.php is missing"
              exit 33
          else
              echo "Composer unavailable; retaining existing vendor dependencies"
          fi
          test -f "$APP/vendor/autoload.php"
          php artisan optimize:clear
          php artisan migrate --force --no-interaction
          if [ -n "${BIRA_DEMO_PASSWORD:-}" ]; then
              BIRA_DEMO_PASSWORD="$BIRA_DEMO_PASSWORD" php artisan db:seed --force --no-interaction
              BIRA_DEMO_PASSWORD="$BIRA_DEMO_PASSWORD" php <<'PHP'
          <?php
          require getcwd().'/vendor/autoload.php';
          $app = require getcwd().'/bootstrap/app.php';
          $kernel = $app->make(\Illuminate\Contracts\Console\Kernel::class);
          $kernel->bootstrap();
          $expected = [
              'admin@biraconsultant.test' => 1,
              'company1@biraconsultant.test' => 2,
              'company2@biraconsultant.test' => 2,
              'company3@biraconsultant.test' => 2,
              'company4@biraconsultant.test' => 2,
              'martha.kila@biraconsultant.test' => 0,
              'peter.wama@biraconsultant.test' => 0,
              'lydia.saro@biraconsultant.test' => 0,
              'daniel.kora@biraconsultant.test' => 0,
              'ruth.mako@biraconsultant.test' => 0,
              'simon.gari@biraconsultant.test' => 0,
              'anna.buka@biraconsultant.test' => 0,
              'james.nori@biraconsultant.test' => 0,
              'grace.toma@biraconsultant.test' => 0,
              'michael.ravu@biraconsultant.test' => 0,
              'helen.kila@biraconsultant.test' => 0,
              'joseph.daro@biraconsultant.test' => 0,
          ];
          foreach ($expected as $email => $role) {
              $user = \App\Models\BiraConsultantUser::where('email', $email)->first();
              if (!$user || (int) $user->role !== $role || !\Illuminate\Support\Facades\Hash::check(getenv('BIRA_DEMO_PASSWORD'), $user->password)) {
                  fwrite(STDERR, "DEMO_CREDENTIAL_CHECK_FAILED: {$email}\n");
                  exit(35);
              }
          }
          echo "DEMO_CREDENTIALS_VERIFIED=17\n";
          PHP
              echo "BIRA_DEMO_SEED_COMPLETED"
          fi
          # Hostinger disables PHP symlink(); create the public storage link with the shell ln command below.
          php artisan config:cache
          php artisan view:cache
          php artisan about --only=environment

          # Replace the domain document root with Laravel's public assets only.
          find "$WEBROOT" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          cp -a "$APP/public/." "$WEBROOT/"
          if [ -e "$WEBROOT/storage" ] || [ -L "$WEBROOT/storage" ]; then rm -rf -- "$WEBROOT/storage"; fi
          ln -s ../bira_app/storage/app/public "$WEBROOT/storage"

          # Rewrite Laravel's front controller to load the private application directory.
          php <<'PHP'
          <?php
          $p = getenv('WEBROOT').'/index.php';
          $s = file_get_contents($p);
          $s = str_replace("__DIR__.'/../storage/framework/maintenance.php'", "__DIR__.'/../bira_app/storage/framework/maintenance.php'", $s);
          $s = str_replace("__DIR__.'/../vendor/autoload.php'", "__DIR__.'/../bira_app/vendor/autoload.php'", $s);
          $s = str_replace("__DIR__.'/../bootstrap/app.php'", "__DIR__.'/../bira_app/bootstrap/app.php'", $s);
          if (strpos($s, "../bira_app/vendor/autoload.php") === false || strpos($s, "../bira_app/bootstrap/app.php") === false) {
              fwrite(STDERR, "Unable to patch public index.php paths\n");
              exit(34);
          }
          file_put_contents($p, $s);
          PHP

          chmod -R u+rwX,g+rwX "$APP/storage" "$APP/bootstrap/cache"
          chmod 0644 "$WEBROOT/index.php"
          php artisan migrate:status
          rm -rf "$STAGE" "$ARCHIVE"
          echo "HOSTINGER_LARAVEL_DEPLOYMENT_COMPLETE"
          REMOTE

      - name: Verify public HTTPS response
        run: |
          set -euo pipefail
          CODE="$(curl -sS -L --max-time 60 -o "$RUNNER_TEMP/bira-home.html" -w '%{http_code}' https://biraconsultants.com/)"
          echo "PUBLIC_HTTP_STATUS=$CODE"
          head -c 500 "$RUNNER_TEMP/bira-home.html" | tr '\n' ' '
          echo
          case "$CODE" in
            200|301|302) echo "PUBLIC_SITE_HTTP_CHECK_PASSED" ;;
            *) echo "Public site did not return a successful page response"; exit 40 ;;
          esac

          # Verify every CSS/JS asset referenced by the live HTML, including its MIME type.
          grep -oE 'https://biraconsultants.com/(css/[^" ]+|js/[^" ]+)' "$RUNNER_TEMP/bira-home.html" | sort -u > "$RUNNER_TEMP/bira-assets.txt"
          test -s "$RUNNER_TEMP/bira-assets.txt"
          while IFS= read -r ASSET; do
            RESULT="$(curl -sS -L --max-time 45 -o /dev/null -w '%{http_code}|%{content_type}' "$ASSET")"
            STATUS="${RESULT%%|*}"
            TYPE="${RESULT#*|}"
            echo "ASSET_CHECK $ASSET => $STATUS $TYPE"
            case "$ASSET" in
              *.css* ) [[ "$STATUS" == "200" && "$TYPE" == text/css* ]] || { echo "CSS asset verification failed"; exit 41; } ;;
              *.js* ) [[ "$STATUS" == "200" && "$TYPE" == application/javascript* || "$STATUS" == "200" && "$TYPE" == application/x-javascript* || "$STATUS" == "200" && "$TYPE" == text/javascript* ]] || { echo "JavaScript asset verification failed"; exit 42; } ;;
            esac
          done < "$RUNNER_TEMP/bira-assets.txt"
          echo "PUBLIC_CSS_JS_ASSET_CHECK_PASSED"
