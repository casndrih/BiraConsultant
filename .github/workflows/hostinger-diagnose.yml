name: Diagnose BiraConsultant production response

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hostinger-diagnose.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check Laravel runtime without exposing secrets
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          port: ${{ secrets.HOSTINGER_PORT }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          command_timeout: 5m
          script: |
            set -eu
            APP="$HOME/domains/biraconsultants.com/bira_app"
            WEB="$HOME/domains/biraconsultants.com/public_html"
            echo "Application directory: $([ -f "$APP/artisan" ] && echo present || echo missing)"
            echo "Public entrypoint: $([ -f "$WEB/index.php" ] && echo present || echo missing)"
            echo "Vendor autoload: $([ -f "$APP/vendor/autoload.php" ] && echo present || echo missing)"
            echo "Environment: $([ -f "$APP/.env" ] && echo present || echo missing)"
            echo "Storage writable: $([ -w "$APP/storage/logs" ] && echo yes || echo no)"
            echo "Public storage link: $(readlink "$WEB/storage" 2>/dev/null || echo missing)"
            cd "$APP"
            php artisan about --only=environment || true
            php artisan migrate:status --no-ansi || true
            php artisan route:list --except-vendor --no-ansi >/dev/null && echo "Route registration: OK" || echo "Route registration: FAILED"
            php -r '
              $f=$argv[1]."/storage/logs/laravel.log";
              if (!is_file($f)) { echo "Laravel log: not present".PHP_EOL; exit; }
              $s=file_get_contents($f);
              preg_match_all("/production\\.ERROR: ([^\\n]+)/",$s,$m);
              $last=end($m[1]);
              if (!$last) { echo "No production.ERROR entry found".PHP_EOL; exit; }
              if (preg_match("/([A-Za-z0-9_\\\\]+Exception|Error|Throwable)/",$last,$e)) echo "Latest exception type: ".$e[1].PHP_EOL;
              else echo "Latest production error entry exists (details withheld).".PHP_EOL;
            ' "$APP"
            echo "HTTP response body (first 500 bytes):"
            curl -sS --max-time 30 https://biraconsultants.com/ | head -c 500 || true
