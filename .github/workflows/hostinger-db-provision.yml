name: Provision Hostinger production database from Laravel schema

on:
  workflow_run:
    workflows: ["Laravel database tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: hostinger-production-database
  cancel-in-progress: false

jobs:
  provision-production-database:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the triggering database test run succeeded
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          LATEST_RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/laravel-database-tests.yml/runs?branch=main&per_page=1" --jq '.workflow_runs[0].id')"
          if [ "$LATEST_RUN_ID" != "$TEST_RUN_ID" ]; then
            echo "A newer database test run exists ($LATEST_RUN_ID); skipping this stale deployment event."
            exit 1
          fi
          CONCLUSION="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TEST_RUN_ID" --jq '.conclusion')"
          echo "Latest database test workflow conclusion: $CONCLUSION"
          test "$CONCLUSION" = "success" || { echo "Refusing production provisioning because CI did not pass."; exit 1; }

      - name: Checkout tested repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install SSH client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Validate Hostinger and database credentials
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          DB_NAME_A: ${{ secrets.HOSTINGER_DB_NAME }}
          DB_NAME_B: ${{ secrets.HOSTINGER_DB_DATABASE }}
          DB_NAME_C: ${{ secrets.DB_DATABASE }}
          DB_USER_A: ${{ secrets.HOSTINGER_DB_USER }}
          DB_USER_B: ${{ secrets.HOSTINGER_DB_USERNAME }}
          DB_USER_C: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD_A: ${{ secrets.HOSTINGER_DB_PASSWORD }}
          DB_PASSWORD_B: ${{ secrets.DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_PASSWORD"
          test -n "${DB_NAME_A:-${DB_NAME_B:-${DB_NAME_C:-}}}" || { echo "Missing database-name secret"; exit 10; }
          test -n "${DB_USER_A:-${DB_USER_B:-${DB_USER_C:-}}}" || { echo "Missing database-username secret"; exit 11; }
          test -n "${DB_PASSWORD_A:-${DB_PASSWORD_B:-}}" || { echo "Missing database-password secret"; exit 12; }

      - name: Upload current models, migrations and seeder
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-65002}"
          REMOTE="$SSH_USER@$SSH_HOST"
          sshpass -p "$SSH_PASSWORD" ssh -T -p "$PORT" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 "$REMOTE" \
            'APP="$HOME/domains/biraconsultants.com/bira_app"; test -f "$APP/artisan" || exit 20; mkdir -p "$APP/database/migrations" "$APP/database/seeders" "$APP/app/Models"'
          sshpass -p "$SSH_PASSWORD" scp -P "$PORT" -o StrictHostKeyChecking=accept-new database/migrations/*.php "$REMOTE:domains/biraconsultants.com/bira_app/database/migrations/"
          sshpass -p "$SSH_PASSWORD" scp -P "$PORT" -o StrictHostKeyChecking=accept-new -r app/Models/. "$REMOTE:domains/biraconsultants.com/bira_app/app/Models/"
          sshpass -p "$SSH_PASSWORD" scp -P "$PORT" -o StrictHostKeyChecking=accept-new database/seeders/DatabaseSeeder.php "$REMOTE:domains/biraconsultants.com/bira_app/database/seeders/DatabaseSeeder.php"

      - name: Run additive migrations and seed synthetic production test records
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_HOST }}
          SSH_USER: ${{ secrets.HOSTINGER_USER }}
          SSH_PORT: ${{ secrets.HOSTINGER_PORT }}
          SSH_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          DB_HOST_A: ${{ secrets.HOSTINGER_DB_HOST }}
          DB_HOST_B: ${{ secrets.DB_HOST }}
          DB_PORT_SECRET: ${{ secrets.HOSTINGER_DB_PORT }}
          DB_NAME_A: ${{ secrets.HOSTINGER_DB_NAME }}
          DB_NAME_B: ${{ secrets.HOSTINGER_DB_DATABASE }}
          DB_NAME_C: ${{ secrets.DB_DATABASE }}
          DB_USER_A: ${{ secrets.HOSTINGER_DB_USER }}
          DB_USER_B: ${{ secrets.HOSTINGER_DB_USERNAME }}
          DB_USER_C: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD_A: ${{ secrets.HOSTINGER_DB_PASSWORD }}
          DB_PASSWORD_B: ${{ secrets.DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          DB_HOST="${DB_HOST_A:-${DB_HOST_B:-localhost}}"
          DB_PORT="${DB_PORT_SECRET:-3306}"
          DB_NAME="${DB_NAME_A:-${DB_NAME_B:-${DB_NAME_C:-}}}"
          DB_USER="${DB_USER_A:-${DB_USER_B:-${DB_USER_C:-}}}"
          DB_PASSWORD="${DB_PASSWORD_A:-${DB_PASSWORD_B:-}}"
          printf -v Q_DB_HOST '%q' "$DB_HOST"
          printf -v Q_DB_PORT '%q' "$DB_PORT"
          printf -v Q_DB_NAME '%q' "$DB_NAME"
          printf -v Q_DB_USER '%q' "$DB_USER"
          printf -v Q_DB_PASSWORD '%q' "$DB_PASSWORD"
          REMOTE_ENV="DB_HOST=$Q_DB_HOST DB_PORT=$Q_DB_PORT DB_NAME=$Q_DB_NAME DB_USER=$Q_DB_USER DB_PASSWORD=$Q_DB_PASSWORD"
          sshpass -p "$SSH_PASSWORD" ssh -T -p "${SSH_PORT:-65002}" -o StrictHostKeyChecking=accept-new -o ConnectTimeout=25 \
            "$SSH_USER@$SSH_HOST" "$REMOTE_ENV bash -s" <<'REMOTE'
          set -euo pipefail
          APP="$HOME/domains/biraconsultants.com/bira_app"
          cd "$APP"
          export DB_CONNECTION=mysql DB_HOST DB_PORT DB_DATABASE="$DB_NAME" DB_USERNAME="$DB_USER" DB_PASSWORD
          export APP_ENV=production APP_DEBUG=false APP_KEY="base64:$(php -r 'echo base64_encode(random_bytes(32));')"
          export CACHE_STORE=file SESSION_DRIVER=file QUEUE_CONNECTION=sync
          mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
          command -v mysql >/dev/null 2>&1 || { echo "MySQL client unavailable"; exit 22; }
          export MYSQL_PWD="$DB_PASSWORD"
          mysql --connect-timeout=20 --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" "$DB_NAME" -Nse 'SELECT CONCAT("CONNECTED_DATABASE=", DATABASE())'
          MIGRATIONS_TABLE="$(mysql --connect-timeout=20 --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" "$DB_NAME" -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_name = 'migrations'")"
          if [ "$MIGRATIONS_TABLE" -eq 0 ]; then
            EXISTING_TABLES="$(mysql --connect-timeout=20 --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" "$DB_NAME" -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema = DATABASE() AND table_type = 'BASE TABLE'")"
            if [ "$EXISTING_TABLES" -ne 0 ]; then
              echo "Database has $EXISTING_TABLES tables but no Laravel migrations ledger; refusing to modify an unknown schema."
              exit 23
            fi
          fi
          echo "Running Laravel migrations (no tables will be dropped)..."
          php artisan config:clear
          php artisan migrate --force --no-interaction
          echo "Seeding synthetic companies, job seekers, jobs, applications and lookup data..."
          php artisan db:seed --force --no-interaction
          php artisan migrate:status
          echo "PRODUCTION_TABLE_COUNTS:"
          mysql --connect-timeout=20 --host="$DB_HOST" --port="$DB_PORT" --user="$DB_USER" "$DB_NAME" -Nse "SELECT CONCAT('users=', (SELECT COUNT(*) FROM biraconsultant_users)), CONCAT('companies=', (SELECT COUNT(*) FROM biraconsultant_companies)), CONCAT('jobs=', (SELECT COUNT(*) FROM biraconsultant_jobs)), CONCAT('applications=', (SELECT COUNT(*) FROM biraconsultant_applications)), CONCAT('countries=', (SELECT COUNT(*) FROM biraconsultant_countries)), CONCAT('settings=', (SELECT COUNT(*) FROM biraconsultant_settings))"
          echo "HOSTINGER_DATABASE_PROVISIONED"
          REMOTE
