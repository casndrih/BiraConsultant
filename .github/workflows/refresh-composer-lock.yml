name: Refresh Composer lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-composer-lock.yml"

permissions:
  contents: write
  workflows: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
      - name: Refresh the Symfony Routing lock entry
        run: |
          mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
          composer update symfony/routing --with-dependencies --no-interaction --prefer-dist
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist
      - name: Commit updated lockfile
        run: |
          sed -i '/echo "=== 5. INSTALL LOCKED PRODUCTION DEPENDENCIES ==="/a\\            mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache' .github/workflows/hostinger-deploy.yml
          if git diff --quiet -- composer.lock .github/workflows/hostinger-deploy.yml; then
            echo "Composer lockfile and deployment workflow are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock .github/workflows/hostinger-deploy.yml
          git commit -m "chore: refresh Composer lockfile for Symfony Routing"
          git push
