name: Remove Hostinger demo site and database

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/hostinger-remove-demo.yml"

permissions:
  contents: read

jobs:
  remove-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Delete demo MySQL database and current public_html source
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          port: ${{ secrets.HOSTINGER_PORT }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          command_timeout: 10m
          script: |
            set -eu
            WEBROOT="$HOME/domains/biraconsultants.com/public_html"
            ENVFILE="$WEBROOT/.env"

            echo "=== Removing current demo database ==="
            test -f "$ENVFILE"
            php -r '
              require $argv[1] . "/vendor/autoload.php";
              $vars = Dotenv\Dotenv::parse(file_get_contents($argv[2]));
              foreach (["DB_HOST","DB_DATABASE","DB_USERNAME","DB_PASSWORD"] as $key) {
                if (!array_key_exists($key, $vars) || $vars[$key] === "") {
                  fwrite(STDERR, "Missing database setting: ".$key.PHP_EOL);
                  exit(2);
                }
              }
              $name = $vars["DB_DATABASE"];
              if (!preg_match("/^[A-Za-z0-9_$-]+$/", $name)) {
                fwrite(STDERR, "Database name contains unsupported characters; refusing unsafe SQL.".PHP_EOL);
                exit(3);
              }
              $port = isset($vars["DB_PORT"]) && $vars["DB_PORT"] !== "" ? (int)$vars["DB_PORT"] : 3306;
              $db = new mysqli($vars["DB_HOST"], $vars["DB_USERNAME"], $vars["DB_PASSWORD"], "", $port);
              if ($db->connect_errno) {
                fwrite(STDERR, "Database connection failed: ".$db->connect_error.PHP_EOL);
                exit(4);
              }
              if (!$db->query("DROP DATABASE `".$name."`")) {
                fwrite(STDERR, "Could not drop database: ".$db->error.PHP_EOL);
                exit(5);
              }
              echo "Demo database dropped successfully.".PHP_EOL;
              $db->close();
            ' "$WEBROOT" "$ENVFILE"

            echo "=== Removing current demo website source ==="
            find "$WEBROOT" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
            if [ -n "$(find "$WEBROOT" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
              echo "Demo source removal verification failed."
              exit 6
            fi
            echo "Demo website source removed. public_html is empty."
