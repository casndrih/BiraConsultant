name: Hostinger database compatibility check

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/hostinger-db-check.yml"

permissions:
  contents: read

jobs:
  inspect-database:
    runs-on: ubuntu-latest
    steps:
      - name: Check current Laravel migration state without changing database
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          port: ${{ secrets.HOSTINGER_PORT }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          command_timeout: 3m
          script: |
            set -eu
            cd "$HOME/domains/biraconsultants.com/public_html"
            echo "=== CURRENT DATABASE MIGRATION STATUS (READ ONLY) ==="
            php artisan migrate:status --no-ansi 2>&1 | head -160 || true
            echo "=== EXISTING DATABASE TABLE INVENTORY (READ ONLY) ==="
            php artisan tinker --execute='$tables = Illuminate\Support\Facades\DB::select("SHOW TABLES"); foreach ($tables as $table) { echo implode(" ", array_values((array) $table)).PHP_EOL; }' 2>&1 | head -160 || true
            echo "=== DATABASE CHECK COMPLETE; NO MIGRATIONS RUN ==="
