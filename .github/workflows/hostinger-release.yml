name: Deploy fresh BiraConsultant release to Hostinger

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hostinger-release.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Install latest GitHub main on Hostinger
        uses: appleboy/ssh-action@v1.2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          port: ${{ secrets.HOSTINGER_PORT }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          envs: GH_TOKEN
          command_timeout: 30m
          script: |
            set -eu
            DOMAIN_DIR="$HOME/domains/biraconsultants.com"
            WEBROOT="$DOMAIN_DIR/public_html"
            APP_DIR="$DOMAIN_DIR/bira_app"
            ENV_SOURCE="$HOME/.biraconsultant-production.env"
            STAGING="$DOMAIN_DIR/bira_release_staging"

            echo "=== Check Hostinger runtime and retained DB settings ==="
            test -d "$WEBROOT"
            test -f "$ENV_SOURCE"
            php -r 'exit(version_compare(PHP_VERSION, "8.2.0", ">=") ? 0 : 1);'
            command -v composer >/dev/null
            command -v node >/dev/null
            command -v npm >/dev/null

            echo "=== Fetch latest main source ==="
            rm -rf "$STAGING"
            git clone --depth 1 --branch main "https://x-access-token:$GH_TOKEN@github.com/casndrih/BiraConsultant.git" "$STAGING"
            cd "$STAGING"
            test -f artisan && test -f composer.lock && test -f package-lock.json
            cp "$ENV_SOURCE" .env
            chmod 600 .env
            sed -i 's/^APP_NAME=.*/APP_NAME="BiraConsultant"/' .env
            sed -i 's/^APP_ENV=.*/APP_ENV=production/' .env
            sed -i 's/^APP_DEBUG=.*/APP_DEBUG=false/' .env
            sed -i 's#^APP_URL=.*#APP_URL=https://biraconsultants.com#' .env
            sed -i 's/^LOG_LEVEL=.*/LOG_LEVEL=error/' .env
            sed -i 's/^SESSION_DRIVER=.*/SESSION_DRIVER=file/' .env
            sed -i 's/^CACHE_STORE=.*/CACHE_STORE=file/' .env
            sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/' .env
            sed -i 's/^APP_KEY=.*/APP_KEY=/' .env

            echo "=== Install PHP and frontend dependencies ==="
            mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            npm ci --no-audit --no-fund
            npm run build
            test -s public/build/manifest.json
            php artisan key:generate --force --no-interaction

            echo "=== Provision clean database and run migrations ==="
            php <<'PHP'
            <?php
            require __DIR__.'/vendor/autoload.php';
            $env = Dotenv\Dotenv::parse(file_get_contents(__DIR__.'/.env'));
            foreach (['DB_HOST','DB_DATABASE','DB_USERNAME','DB_PASSWORD'] as $key) {
                if (!isset($env[$key]) || $env[$key] === '') { fwrite(STDERR, "Missing required database setting: ".$key.PHP_EOL); exit(2); }
            }
            $name = $env['DB_DATABASE'];
            if (!preg_match('/^[A-Za-z0-9_$-]+$/', $name)) { fwrite(STDERR, "Unsupported database name format.".PHP_EOL); exit(3); }
            $port = !empty($env['DB_PORT']) ? (int)$env['DB_PORT'] : 3306;
            $db = new mysqli($env['DB_HOST'], $env['DB_USERNAME'], $env['DB_PASSWORD'], '', $port);
            if ($db->connect_errno) { fwrite(STDERR, "Hostinger MySQL connection failed: ".$db->connect_error.PHP_EOL); exit(4); }
            if (!$db->query("CREATE DATABASE IF NOT EXISTS `".$name."` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci")) {
                fwrite(STDERR, "Cannot create new Hostinger database; create it in hPanel. MySQL: ".$db->error.PHP_EOL); exit(5);
            }
            echo "Fresh database is ready.".PHP_EOL;
            PHP
            php artisan migrate --force --no-interaction
            php artisan config:cache
            php artisan view:cache
            php artisan route:cache

            echo "=== Publish Laravel public document root ==="
            chmod -R ug+rwX storage bootstrap/cache
            rm -rf "$APP_DIR"
            mv "$STAGING" "$APP_DIR"
            find "$WEBROOT" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
            cp -a "$APP_DIR/public/." "$WEBROOT/"
            cat > "$WEBROOT/index.php" <<'PHP'
            <?php
            error_reporting(E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED);
            use Illuminate\Http\Request;
            define('LARAVEL_START', microtime(true));
            $appRoot = dirname(__DIR__).'/bira_app';
            if (file_exists($maintenance = $appRoot.'/storage/framework/maintenance.php')) {
                require $maintenance;
            }
            require $appRoot.'/vendor/autoload.php';
            (require_once $appRoot.'/bootstrap/app.php')->handleRequest(Request::capture());
            PHP
            rm -rf "$WEBROOT/storage"
            ln -s "$APP_DIR/storage/app/public" "$WEBROOT/storage"
            chmod 640 "$APP_DIR/.env"
            chmod -R ug+rwX "$APP_DIR/storage" "$APP_DIR/bootstrap/cache"

            echo "=== Verify production website ==="
            test -f "$APP_DIR/vendor/autoload.php"
            test -f "$WEBROOT/build/manifest.json"
            php "$APP_DIR/artisan" --version
            HTTP_CODE="$(curl -sS -L --max-time 60 -o /tmp/biraconsultant-home.html -w '%{http_code}' https://biraconsultants.com/)"
            echo "Homepage HTTP status: $HTTP_CODE"
            case "$HTTP_CODE" in 200|301|302) ;; *) echo "HTTP verification failed"; exit 6 ;; esac
            if grep -Eqi 'Whoops|SQLSTATE\[|APP_DEBUG|ParseError|Fatal error' /tmp/biraconsultant-home.html; then
              echo "Application error detected on homepage"; exit 7
            fi
            echo "SUCCESS: Fresh BiraConsultant source deployed from GitHub main."
