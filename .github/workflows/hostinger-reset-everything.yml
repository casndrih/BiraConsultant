name: Permanently reset BiraConsultant Hostinger demo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hostinger-reset-everything.yml"

permissions:
  contents: read

jobs:
  destructive-reset:
    runs-on: ubuntu-latest
    steps:
      - name: Drop application database and delete source, env, and uploads
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USER }}
          port: ${{ secrets.HOSTINGER_PORT }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          command_timeout: 10m
          script: |
            set -eu
            DOMAIN_DIR="$HOME/domains/biraconsultants.com"
            WEBROOT="$DOMAIN_DIR/public_html"
            APP_DIR="$DOMAIN_DIR/bira_app"
            ENV_BACKUP="$HOME/.biraconsultant-production.env"
            ENV_FILE=""

            test -d "$DOMAIN_DIR"
            test -d "$WEBROOT"

            if [ -f "$APP_DIR/.env" ]; then
              ENV_FILE="$APP_DIR/.env"
            elif [ -f "$WEBROOT/.env" ]; then
              ENV_FILE="$WEBROOT/.env"
            elif [ -f "$ENV_BACKUP" ]; then
              ENV_FILE="$ENV_BACKUP"
            fi

            echo "=== Drop configured application database ==="
            if [ -n "$ENV_FILE" ]; then
              DB_CONNECTION="$(sed -n 's/^DB_CONNECTION=//p' "$ENV_FILE" | tail -n 1 | tr -d '"' | tr -d "'")"
              DB_HOST="$(sed -n 's/^DB_HOST=//p' "$ENV_FILE" | tail -n 1 | tr -d '"' | tr -d "'")"
              DB_PORT="$(sed -n 's/^DB_PORT=//p' "$ENV_FILE" | tail -n 1 | tr -d '"' | tr -d "'")"
              DB_DATABASE="$(sed -n 's/^DB_DATABASE=//p' "$ENV_FILE" | tail -n 1 | tr -d '"' | tr -d "'")"
              DB_USERNAME="$(sed -n 's/^DB_USERNAME=//p' "$ENV_FILE" | tail -n 1 | tr -d '"' | tr -d "'")"
              DB_PASSWORD="$(sed -n 's/^DB_PASSWORD=//p' "$ENV_FILE" | tail -n 1 | sed 's/^["'"]//; s/["'"]$//')"

              if [ "$DB_CONNECTION" = "mysql" ] && [ -n "$DB_HOST" ] && [ -n "$DB_DATABASE" ] && [ -n "$DB_USERNAME" ]; then
                command -v mysql >/dev/null 2>&1 || { echo "MySQL client unavailable; refusing to claim database was deleted."; exit 1; }
                DB_PORT="${DB_PORT:-3306}"
                DB_DATABASE_ESCAPED="$(printf '%s' "$DB_DATABASE" | sed 's/`/``/g')"
                MYSQL_PWD="$DB_PASSWORD" mysql --protocol=TCP -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USERNAME" -e "DROP DATABASE IF EXISTS `$DB_DATABASE_ESCAPED`;"
                echo "Database dropped: $DB_DATABASE"
              else
                echo "Database settings missing or unsupported in discovered .env; refusing to continue."
                exit 1
              fi
            else
              echo "No application .env found; cannot safely identify the database. Refusing to continue."
              exit 1
            fi

            echo "=== Delete application source, release folders, environment files, and uploaded data ==="
            rm -rf -- "$APP_DIR" "$DOMAIN_DIR/releases" "$DOMAIN_DIR/bira_release_staging" "$DOMAIN_DIR/bira_preserved_uploads" "$WEBROOT"
            rm -f -- "$ENV_BACKUP"
            find "$DOMAIN_DIR" -maxdepth 3 -type f -name '.env' -delete
            mkdir -p "$WEBROOT"

            echo "=== Verify destructive reset ==="
            test ! -e "$APP_DIR"
            test ! -e "$DOMAIN_DIR/releases"
            test ! -e "$DOMAIN_DIR/bira_preserved_uploads"
            test ! -e "$ENV_BACKUP"
            test -d "$WEBROOT"
            if find "$DOMAIN_DIR" -maxdepth 3 -type f -name '.env' | grep -q .; then
              echo "An .env file remains under the domain directory."
              exit 1
            fi
            echo "Hostinger app source, configured database, .env files, and uploaded files have been removed."
