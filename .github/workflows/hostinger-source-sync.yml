name: Export rebuilt BiraConsultant source from Hostinger

on:
  push:
    paths:
      - ".github/workflows/hostinger-source-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH client
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Create clean source archive on Hostinger and download it
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_HOST" && test -n "$HOSTINGER_USER" && test -n "$HOSTINGER_PASSWORD"
          REMOTE_ARCHIVE="/tmp/biraconsultant-source-${GITHUB_RUN_ID}.tar.gz"
          sshpass -p "$HOSTINGER_PASSWORD" ssh -p "${HOSTINGER_PORT:-22}" -o StrictHostKeyChecking=no -o ConnectTimeout=25 "$HOSTINGER_USER@$HOSTINGER_HOST" "bash -s -- '$REMOTE_ARCHIVE'" <<'REMOTE'
          set -euo pipefail
          ARCHIVE="$1"
          APP_DIR="$HOME/domains/biraconsultants.com/bira_app"
          test -f "$APP_DIR/artisan"
          test -f "$APP_DIR/composer.json"
          test -f "$APP_DIR/package.json"
          test -f "$APP_DIR/webpack.mix.js"
          cd "$APP_DIR"
          tar -czf "$ARCHIVE" \
            --exclude='./.git' \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='./vendor' \
            --exclude='./node_modules' \
            --exclude='./storage/logs' \
            --exclude='./storage/framework/cache' \
            --exclude='./storage/framework/sessions' \
            --exclude='./storage/framework/views' \
            --exclude='./storage/debugbar' \
            --exclude='./bootstrap/cache/*.php' \
            --exclude='./public/storage' \
            .
          echo "ARCHIVE_CREATED=$ARCHIVE"
          du -h "$ARCHIVE"
          REMOTE
          mkdir -p export
          sshpass -p "$HOSTINGER_PASSWORD" scp -P "${HOSTINGER_PORT:-22}" -o StrictHostKeyChecking=no "$HOSTINGER_USER@$HOSTINGER_HOST:$REMOTE_ARCHIVE" export/biraconsultant-source.tar.gz
          test -s export/biraconsultant-source.tar.gz
          tar -tzf export/biraconsultant-source.tar.gz > export/archive-contents.txt
          head -30 export/archive-contents.txt

      - name: Upload source archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: biraconsultant-source
          path: export/biraconsultant-source.tar.gz
          if-no-files-found: error
          retention-days: 3


  commit-source:
    needs: export-source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download exported source artifact
        uses: actions/download-artifact@v4
        with:
          name: biraconsultant-source
          path: source-export

      - name: Replace repository application source with Hostinger copy
        run: |
          set -euo pipefail
          mkdir -p source
          tar -xzf source-export/biraconsultant-source.tar.gz -C source
          test -f source/artisan
          test -f source/composer.json
          test -f source/package.json
          test -f source/webpack.mix.js
          rsync -a --delete --exclude='.git/' --exclude='.github/' source/ ./
          test -f artisan
          test -f composer.json
          test -f package.json
          test -f webpack.mix.js
          echo "Application source files: $(find . -type f -not -path './.git/*' -not -path './.github/*' | wc -l)"
          echo "Built theme: $(test -f public/css/biraconsultant-theme.css && echo present || echo missing)"
          git status --short

      - name: Commit rebuilt application source to main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Sync rebuilt BiraConsultant source from Hostinger"
          git push origin HEAD:main
