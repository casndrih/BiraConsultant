name: Refine BiraConsultant gold theme
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-bira-theme.yml
permissions:
  contents: write
jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild theme from original source with gold palette
        run: |
          git show bbbf078205e51626f9159966bf5032fde955e55c:resources/css/qjobs-theme.css > /tmp/original-theme.css
          python3 - <<'PY'
          import colorsys
          import re
          from pathlib import Path

          source = Path("/tmp/original-theme.css").read_text(encoding="utf-8")
          source = re.sub(r"qj(?=[_-])", "bc", source, flags=re.IGNORECASE)
          source = source.replace("green-hover", "yellow-hover")

          def recolor(match):
              value = match.group(0)
              if value.startswith("#"):
                  raw = value[1:]
                  if len(raw) == 3:
                      raw = "".join(ch * 2 for ch in raw)
                  if len(raw) != 6:
                      return value
                  rgb = tuple(int(raw[i:i+2], 16) / 255 for i in (0, 2, 4))
              else:
                  nums = re.findall(r"[-+]?(?:\d*\.)?\d+", value)
                  if len(nums) < 3:
                      return value
                  rgb = tuple(max(0, min(255, float(n))) / 255 for n in nums[:3])
              h, lightness, saturation = colorsys.rgb_to_hls(*rgb)
              if not (70 <= h * 360 <= 165 and saturation > 0.12):
                  return value
              h = 45 / 360
              saturation = min(max(saturation, 0.42), 0.78)
              r, g, b = colorsys.hls_to_rgb(h, lightness, saturation)
              if value.startswith("#"):
                  return "#{:02x}{:02x}{:02x}".format(round(r*255), round(g*255), round(b*255))
              parts = [str(round(r*255)), str(round(g*255)), str(round(b*255))]
              nums = re.findall(r"[-+]?(?:\d*\.)?\d+", value)
              return ("rgba(" if value.startswith("rgba") else "rgb(") + ", ".join(parts + nums[3:]) + ")"

          source = re.sub(r"#[0-9a-fA-F]{3,6}\b|rgba?\([^)]*\)", recolor, source)
          replacements = {
              "--bc-brand": "#F4C542",
              "--bc-brand-hover": "#E5B82E",
              "--bc-brand-soft": "#FFF7D6",
              "--bc-brand-ink": "#5B4500",
              "--bc-ink": "#1F2937",
              "--bc-muted": "#6B7280",
              "--bc-line": "#E5E7EB",
              "--bc-surface-alt": "#F9FAFB",
              "--bc-shadow": "0 14px 36px rgba(17, 24, 39, .08)"
          }
          for variable, value in replacements.items():
              source = re.sub(re.escape(variable) + r"\s*:\s*[^;]+;", variable + ": " + value + ";", source)

          source += """

          /* BiraConsultant gold brand overrides */
          :root {
            --bc-brand: #F4C542;
            --bc-brand-hover: #E5B82E;
            --bc-brand-soft: #FFF7D6;
            --bc-brand-ink: #5B4500;
          }
          .bc-brand__logo { display: block; width: 44px; height: 44px; flex: 0 0 auto; object-fit: contain; }
          .text-green-50,.text-green-100,.text-green-200,.text-green-300,.text-green-400,.text-green-500,.text-green-600,.text-green-700,.text-green-800,.text-green-900 { color: var(--bc-brand-ink) !important; }
          .bg-green-50,.bg-green-100,.bg-green-200 { background-color: var(--bc-brand-soft) !important; }
          .bg-green-300,.bg-green-400,.bg-green-500,.bg-green-600,.bg-green-700,.bg-green-800,.bg-green-900 { background-color: var(--bc-brand) !important; color: #4A3900 !important; }
          .border-green-100,.border-green-200,.border-green-300,.border-green-400,.border-green-500,.border-green-600,.border-green-700 { border-color: var(--bc-brand-hover) !important; }
          .hover\\:bg-green-50:hover,.hover\\:bg-green-100:hover,.hover\\:bg-green-200:hover,.hover\\:bg-green-500:hover,.hover\\:bg-green-600:hover,.hover\\:bg-green-700:hover { background-color: var(--bc-brand-hover) !important; }
          .focus\\:ring-green-500:focus,.focus\\:border-green-500:focus { --tw-ring-color: var(--bc-brand) !important; border-color: var(--bc-brand) !important; }
          """
          Path("resources/css/biraconsultant-theme.css").write_text(source, encoding="utf-8")
          Path("public/css/biraconsultant-theme.css").write_text(source, encoding="utf-8")
          print("Rebuilt both theme stylesheets with a clean gold palette.")
          PY
      - name: Commit refined theme
        run: |
          rm -f .github/workflows/repair-bira-theme.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine BiraConsultant yellow gold theme"
          git push
